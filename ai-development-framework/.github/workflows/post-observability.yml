name: post-observability

on:
  workflow_run:
    workflows: [agentic-pipeline]
    types: [completed]

concurrency:
  group: post-observability-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Post the validated summary from the completed gate run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          [ -n "$PR_NUMBER" ] || exit 0
          dir="$(mktemp -d)"
          trap 'rm -rf "$dir"' EXIT
          gh run download "$RUN_ID" --repo "$GH_REPO" --name observability-summary --dir "$dir"
          file="$(find "$dir" -name observability-summary.txt -type f -print -quit)"
          [ -n "$file" ] || exit 0
          summary="$(tr '\n' ' ' < "$file")"
          [[ "$summary" =~ ^observability:\ events=[0-9]+\ success=[0-9]+\ success_rate=(na|[0-9]+[.][0-9]%)\ failure=[0-9]+\ switches=[0-9]+\ switch_rate=(na|[0-9]+[.][0-9]%)\ tokens=(na|[0-9]+)\ cost_usd_estimate=(na|[0-9]+[.][0-9]+)\ eval_runs=[0-9]+[[:space:]]*$ ]] || exit 1
          printf '### Observability\n`%s`\n' "$summary" | gh pr comment "$PR_NUMBER" --repo "$GH_REPO" --body-file -
