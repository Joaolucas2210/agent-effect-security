name: agentic-pipeline

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]

concurrency:
  group: agentic-pipeline-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FRAMEWORK_DIR: ai-development-framework
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify pilot history prerequisites
        run: |
          if ! git rev-parse --verify --quiet 'HEAD~1^{commit}' >/dev/null 2>&1 || ! git rev-parse --verify --quiet 'HEAD~2^{commit}' >/dev/null 2>&1; then
            echo "pilot_history_prerequisite_unavailable"
            exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install control-plane packages (editable, local) and test dependencies
        run: python -m pip install --disable-pip-version-check -e "$FRAMEWORK_DIR" -r "$FRAMEWORK_DIR/requirements-test.txt"
      - name: Build the local code graph
        run: |
          python -m pip install --disable-pip-version-check graphifyy==0.9.47
          graphify extract . --code-only
          graphify cluster-only . --no-label
      - name: Change safety guard
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base="HEAD^"
          if [ "${{ github.event_name }}" = pull_request ]; then
            base="origin/$BASE_REF"
          fi
          if ! git rev-parse --verify --quiet "${base}^{commit}" >/dev/null 2>&1; then
            echo "change_safety_base_ref_unavailable"
            exit 1
          fi
          count="$(git diff --name-only "$base"...HEAD | wc -l | tr -d ' ')"
          [ "$count" -le 30 ] || { echo "::error::file-count sanity check failed: $count > 30"; exit 1; }
          ! git diff --name-only "$base"...HEAD | grep -E '(^|/)\.env($|\.)|\.(pem|p12|key)$'
          private_key="BEGIN "
          private_key+="[A-Z ]*PRIVATE KEY"
          pem="-----BE"
          pem+="GIN"
          secret_pattern="^\\+.*($private_key|AKIA[0-9A-Z]{16}|$pem)"
          if git diff --unified=0 "$base"...HEAD | grep -E "$secret_pattern"; then
            echo "::error::possible secret in added content"
            exit 1
          fi
      - name: Run local evidence pilot
        run: make local-evidence-pilot
      - name: Check knowledge graph freshness
        run: |
          if [ -f graphify-out/graph.json ]; then
            [ -f graphify-out/.stale ] && echo "::warning::graph stale — run '/graphify . --update' in-agent" || echo "::notice::graph present"
          else
            echo "::notice::no graphify-out/graph.json — build in-agent with '/graphify .'"
          fi
      - name: Run quality gates
        env:
          # The EDD gate diffs against the PR base; on push it falls back to origin/main.
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          chmod +x "$FRAMEWORK_DIR"/hooks/*.sh
          "$FRAMEWORK_DIR/hooks/ci-quality-gates.sh"
      - name: Maintainer audits
        run: |
          make mcp-audit
          make skill-audit
          make graph-check
      - name: Ponytail review gate
        run: |
          echo "::group::Ponytail review"
          echo "Must-cut findings block the PR; justify deliberate ceilings with a ponytail comment."
          git diff --check
          echo "::endgroup::"
      - name: Observability summary
        run: |
          chmod +x "$FRAMEWORK_DIR/hooks/observability.sh"
          TASK="pr-${{ github.event.pull_request.number || github.run_id }}" ARCHETYPE=Maintainer PHASE=quality \
            TOKENS_IN=na TOKENS_OUT=na BUDGET_REMAINING=na DURATION_SECONDS=na OUTCOME=success \
            "$FRAMEWORK_DIR/hooks/observability.sh" complete
          make metrics | tee -a "$GITHUB_STEP_SUMMARY"
          make metrics > observability-summary.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: observability-summary
          path: observability-summary.txt
          if-no-files-found: error

  e2e:
    # Release check: a fresh clone of the committed tree, a new venv, the adf CLI, both edges, both trials.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: End-to-end release quickstart
        run: bash ai-development-framework/e2e/quickstart.sh

  secret-scan:
    # gitleaks over the full history with the repo's config (.gitleaks.toml); the image is pinned by digest.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (redacted)
        run: >-
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks:v8.18.4@sha256:75bdb2b2f4db213cde0b8295f13a88d6b333091bbfbf3012a4e083d00d31caba
          detect --source /repo --config /repo/.gitleaks.toml --log-opts=--all --redact --no-banner

  spec-pr:
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'agent:spec') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request == null &&
       github.event.comment.body == '/agent proceed' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Create draft Spec PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          branch="agent/spec/issue-$ISSUE_NUMBER"
          gh label create agent:spec --color 1D76DB --description "Agent-generated specification" --force || true
          gh label create agent:approved-plan --color 0E8A16 --description "Authorized actor approved the spec plan" --force || true
          git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null && exit 0
          title="$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" --jq .title)"
          git switch -c "$branch" "origin/$DEFAULT_BRANCH"
          mkdir -p docs/specs
          {
            printf '# Spec: %s\n\n' "$title"
            printf -- '- Source issue: #%s\n- Status: draft — authorized actor approval required\n\n' "$ISSUE_NUMBER"
            printf '## Problem\n\nDescribe the observable outcome and constraints from the issue.\n\n'
            printf '## Smallest plan\n\n- [ ] Identify reuse with Graphify\n- [ ] Add one vertical slice and its gate\n\n'
            printf '## Non-goals\n\n- No new dependency or MCP server without inventory and audit.\n'
          } > "docs/specs/issue-$ISSUE_NUMBER.md"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "docs/specs/issue-$ISSUE_NUMBER.md"
          git commit -m "docs: draft spec for issue $ISSUE_NUMBER"
          git push -u origin "$branch"
          gh pr create --base "$DEFAULT_BRANCH" --head "$branch" --draft --label agent:spec \
            --title "spec: $title" --body "Closes #$ISSUE_NUMBER\n\nApprove the plan with \`/approve-plan\`, then merge to create the Implementation PR."

  approve-plan:
    if: >-
      github.event_name == 'issue_comment' && github.event.issue.pull_request != null &&
      github.event.comment.body == '/approve-plan' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Mark the Spec PR approved
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' | grep -qx agent:spec || exit 0
          gh pr edit "$PR_NUMBER" --add-label agent:approved-plan
          gh pr comment "$PR_NUMBER" --body "Plan approval recorded. Merge this Spec PR to create the draft Implementation PR."

  implementation-pr:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'agent:spec') &&
      contains(github.event.pull_request.labels.*.name, 'agent:approved-plan')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Create draft Implementation PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SPEC_PR: ${{ github.event.pull_request.number }}
          SPEC_BRANCH: ${{ github.event.pull_request.head.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          issue="${SPEC_BRANCH##*/issue-}"
          [[ "$issue" =~ ^[0-9]+$ ]] || { echo "::error::spec branch must end in issue-<number>"; exit 1; }
          branch="agent/implementation/issue-$issue"
          gh label create agent:implementation --color 5319E7 --description "Agent implementation ready for Builder" --force || true
          gh label create agent:implementation-ready --color FBCA04 --description "Implementation may begin" --force || true
          git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null && exit 0
          git switch -c "$branch" "origin/$DEFAULT_BRANCH"
          mkdir -p docs/implementation
          {
            printf '# Implementation: issue %s\n\n' "$issue"
            printf -- '- Spec PR: #%s\n- Status: draft — Builder work has not started\n\n' "$SPEC_PR"
            printf '## Required gates\n\n- [ ] `make quality`\n- [ ] `make mcp-audit`, `make skill-audit`, `make graph-check`\n- [ ] `make observability-complete` and `make metrics`\n'
          } > "docs/implementation/issue-$issue.md"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "docs/implementation/issue-$issue.md"
          git commit -m "docs: start implementation for issue $issue"
          git push -u origin "$branch"
          gh pr create --base "$DEFAULT_BRANCH" --head "$branch" --draft --label agent:implementation \
            --title "implement: issue $issue" --body "Implements the approved plan in #$SPEC_PR. Comment \`/agent implement\` to mark Builder work ready."

  implementation-ready:
    if: >-
      github.event_name == 'issue_comment' && github.event.issue.pull_request != null &&
      github.event.comment.body == '/agent implement' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Mark Builder work ready
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' | grep -qx agent:implementation || exit 0
          gh pr edit "$PR_NUMBER" --add-label agent:implementation-ready
          gh pr comment "$PR_NUMBER" --body "Builder work is authorized. Follow `/build → /test → /review → /ship`; agents propose, humans retain architectural taste."
