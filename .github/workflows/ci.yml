name: ci

# Read-only quality gates. No job here can write to the repository, issues or PRs, and no secret
# besides the default read-scoped GITHUB_TOKEN is available. Write automations live in
# agentic-automation.yml, which stays inert until the owner opts in.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FRAMEWORK_DIR: ai-development-framework
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify pilot history prerequisites
        run: |
          if ! git rev-parse --verify --quiet 'HEAD~1^{commit}' >/dev/null 2>&1 || ! git rev-parse --verify --quiet 'HEAD~2^{commit}' >/dev/null 2>&1; then
            echo "pilot_history_prerequisite_unavailable"
            exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install control-plane packages (editable, local) and test dependencies
        run: python -m pip install --disable-pip-version-check -e "$FRAMEWORK_DIR" -r "$FRAMEWORK_DIR/requirements-test.txt"
      - name: Build the local code graph
        run: |
          python -m pip install --disable-pip-version-check graphifyy==0.9.47
          graphify extract . --code-only
          graphify cluster-only . --no-label
      - name: Change safety guard
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base="HEAD^"
          if [ "${{ github.event_name }}" = pull_request ]; then
            base="origin/$BASE_REF"
          fi
          if ! git rev-parse --verify --quiet "${base}^{commit}" >/dev/null 2>&1; then
            echo "change_safety_base_ref_unavailable"
            exit 1
          fi
          count="$(git diff --name-only "$base"...HEAD | wc -l | tr -d ' ')"
          [ "$count" -le 30 ] || { echo "::error::file-count sanity check failed: $count > 30"; exit 1; }
          # `! cmd` does not trip `bash -e`; test explicitly so a key or .env path fails the job.
          if git diff --name-only "$base"...HEAD | grep -E '(^|/)\.env($|\.)|\.(pem|p12|key)$'; then
            echo "::error::secret-bearing path in the change set"
            exit 1
          fi
          private_key="BEGIN "
          private_key+="[A-Z ]*PRIVATE KEY"
          pem="-----BE"
          pem+="GIN"
          secret_pattern="^\\+.*($private_key|AKIA[0-9A-Z]{16}|$pem)"
          if git diff --unified=0 "$base"...HEAD | grep -E "$secret_pattern"; then
            echo "::error::possible secret in added content"
            exit 1
          fi
      - name: Run local evidence pilot
        run: make local-evidence-pilot
      - name: Check knowledge graph freshness
        run: |
          if [ -f graphify-out/graph.json ]; then
            [ -f graphify-out/.stale ] && echo "::warning::graph stale — run '/graphify . --update' in-agent" || echo "::notice::graph present"
          else
            echo "::notice::no graphify-out/graph.json — build in-agent with '/graphify .'"
          fi
      - name: Run quality gates
        env:
          # The EDD gate diffs against the PR base; on push it falls back to origin/main.
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          chmod +x "$FRAMEWORK_DIR"/hooks/*.sh
          "$FRAMEWORK_DIR/hooks/ci-quality-gates.sh"
      - name: Maintainer audits
        run: |
          make mcp-audit
          make skill-audit
          make graph-check
      - name: Ponytail review gate
        run: |
          echo "::group::Ponytail review"
          echo "Must-cut findings block the PR; justify deliberate ceilings with a ponytail comment."
          git diff --check
          echo "::endgroup::"
      - name: Observability summary
        run: |
          chmod +x "$FRAMEWORK_DIR/hooks/observability.sh"
          TASK="pr-${{ github.event.pull_request.number || github.run_id }}" ARCHETYPE=Maintainer PHASE=quality \
            TOKENS_IN=na TOKENS_OUT=na BUDGET_REMAINING=na DURATION_SECONDS=na OUTCOME=success \
            "$FRAMEWORK_DIR/hooks/observability.sh" complete
          make metrics | tee -a "$GITHUB_STEP_SUMMARY"
          make metrics > observability-summary.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: observability-summary
          path: observability-summary.txt
          if-no-files-found: error

  e2e:
    # Release check: a fresh clone of the committed tree, a new venv, the adf CLI, both edges, both trials.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: End-to-end release quickstart
        run: bash ai-development-framework/e2e/quickstart.sh

  secret-scan:
    # gitleaks over the full history with the repo's config (.gitleaks.toml); the image is pinned by digest.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (redacted)
        run: >-
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks:v8.18.4@sha256:75bdb2b2f4db213cde0b8295f13a88d6b333091bbfbf3012a4e083d00d31caba
          detect --source /repo --config /repo/.gitleaks.toml --log-opts=--all --redact --no-banner
