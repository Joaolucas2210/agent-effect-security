name: closed-maintenance-loops

on:
  schedule:
    - cron: '17 3 * * 2-6' # daily UTC: controls and health checks
    - cron: '17 3 * * 1' # weekly: also run suggestion-only cleanup sweeps
  workflow_dispatch:
    inputs:
      routine:
        description: Routine to run (all, dead-code, abstractions, security, graph, token-budget, governance)
        default: all
        required: true
        type: string

permissions:
  contents: read

jobs:
  maintain:
    runs-on: ubuntu-latest
    env:
      DRY_RUN: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install control-plane packages (editable, local) and test dependencies
        run: python -m pip install --disable-pip-version-check -e ai-development-framework -r ai-development-framework/requirements-test.txt
      - name: Install graph reader
        run: python -m pip install --disable-pip-version-check graphifyy==0.9.47
      - name: Build graph for suggestion evidence
        run: graphify extract . --code-only && graphify cluster-only . --no-label
      - name: Run closed maintenance loops
        env:
          REQUESTED: ${{ inputs.routine || 'daily' }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          routines="$REQUESTED"
          [ "$routines" = daily ] && routines='security graph token-budget governance'
          [ "$SCHEDULE" = '17 3 * * 1' ] && routines='security graph token-budget governance dead-code abstractions'
          [ "$routines" = all ] && routines='security graph token-budget governance dead-code abstractions'
          for routine in $routines; do make "routine-$routine"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: maintenance-observability
          path: ai-development-framework/docs/observability/
          if-no-files-found: warn
