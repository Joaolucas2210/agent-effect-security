# Dev only (ADR 0020): Jaeger all-in-one receives OTLP/HTTP on 4318, UI on 16686. Loopback binds,
# in-memory storage: traces vanish on restart. Not evidence; never point production traffic here.
services:
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"
