# Supported install: the source clone, editable: `make install-dev` / `python3 -m pip install -e ./ai-development-framework`.
# It also builds as a local sdist + wheel (packages, the hook modules integration/*.py, their v1/v2 JSON contracts;
# hooks/test-packaging-wheel.sh, test-hook-wheel-equivalence.sh); only `adf policy build` needs the clone. Not published to PyPI (README
# non-goals, ADR 0008). One console script, `adf` (ADR 0025); it is an operator CLI, not a published runtime.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "adf-control-plane"
version = "0.2.0"  # keep aligned with ../VERSION (hooks/test-packaging.sh enforces it)
description = "Read-only local control plane: PDP, PEP + confined read runtime, evidence bundle and reference adapter"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["jsonschema==4.26.0"]

[project.optional-dependencies]
mcp = ["mcp[cli]==2.3.0"]
codex = ["tomli>=2.0; python_version < '3.11'"]

[project.scripts]
adf = "integration.cli:main"

[tool.setuptools]
packages = ["tools", "runtime", "integration"]

[tool.setuptools.package-data]
"*" = ["v1/**/*.json", "v2/**/*.json"]
